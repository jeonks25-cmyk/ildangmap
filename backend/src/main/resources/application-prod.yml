server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            # prod: 샘플 폴백 없음 — 미설정 시 기동 실패로 조기 발견
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            # Vercel 프록시 기준 Redirect URI (카카오 콘솔과 일치)
            redirect-uri: "${OAUTH_REDIRECT_URI:https://ildangmap.vercel.app/login/oauth2/code/kakao}"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
    root: info

management:
  endpoint:
    health:
      show-details: when_authorized
