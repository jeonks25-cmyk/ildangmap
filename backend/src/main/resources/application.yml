server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: ILDANGMAPSESSION
        same-site: none
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: ildangmap-backend
  datasource:
    url: jdbc:mysql://localhost:3306/ildangmap?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 100
  sql:
    init:
      # 기존 DB 스키마와 data.sql 컬럼 불일치 시 기동 실패 방지 (시드는 JPA·OAuth 가입으로 처리)
      mode: never
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:sample-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:sample-kakao-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method

app:
  frontend-origin: ${APP_FRONTEND_ORIGIN:http://localhost:3000}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
  # 카카오 로그인 성공 후 브라우저 이동 경로 (프론트 라우트). 쿼리 login=success 로 세션 동기화 트리거
  post-login-redirect-path: /map

# --- 카카오 개발자 콘솔 (앱 > 플랫폼 Web 도메인 localhost 등록) ---
# Redirect URI (Spring OAuth2): http://localhost:8080/login/oauth2/code/kakao
# 동의항목: 닉네임·프로필 사진·카카오계정(이메일) — application.yml scope 와 일치

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
